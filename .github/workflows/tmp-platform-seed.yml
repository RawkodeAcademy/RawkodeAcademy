# Temporary, one-off: backs up and seeds the platform content D1 databases from
# content/ on main. Mode is read from .github/tmp-seed/MODE. Delete with this branch.
name: platform-content-seed
on:
  push:
    branches:
    - tmp/d1-inventory
permissions:
  contents: read
jobs:
  seed:
    name: platform-content-seed
    runs-on: namespace-profile-linux-x86
    environment: production
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
    - name: Checkout seed job
      uses: actions/checkout@v4
      with:
        path: .seed
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Determinate receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Prune Determinate Nix receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.55.1"
        if [ -z "$cuenv_version" ]; then
          cuenv_version="latest"
        fi
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -fsSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: Setup 1Password
      run: cuenv exec -- cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Build seeds from content
      run: |-
        cp .seed/.github/tmp-seed/platform-seed.ts content/scripts/platform-seed.ts
        set -o pipefail
        cd content && nix shell nixpkgs#bun -c bun scripts/platform-seed.ts --out "$RUNNER_TEMP/seed" 2>&1 | grep -v '^  shows/.*local file' | tee "$RUNNER_TEMP/rows.txt"
        echo "::notice title=seed rows (main@$(git rev-parse --short HEAD))::$(grep -E '^[a-z-]+: [0-9]+ rows' "$RUNNER_TEMP/rows.txt" | tr '\n' ' ')"
        grep -E '^  ' "$RUNNER_TEMP/rows.txt" | grep -v '^  shows/.*local file' | head -5 | sed 's/^ */::warning title=seed::/' || true
    - name: Back up, diff and seed
      working-directory: projects/rawkode.academy/platform/brackets
      run: cuenv -e production exec -- env RUNNER_TEMP="$RUNNER_TEMP" bash "$GITHUB_WORKSPACE/.seed/.github/tmp-seed/seed.sh" "$(cat "$GITHUB_WORKSPACE/.seed/.github/tmp-seed/MODE")"
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Publish technology icons
      working-directory: projects/rawkode.academy/platform/brackets
      run: cuenv -e production exec -- bash "$GITHUB_WORKSPACE/.seed/.github/tmp-seed/icons.sh" "$GITHUB_WORKSPACE"
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Keep the backups
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: platform-content-backup-${{ github.run_id }}
        path: ${{ runner.temp }}/backup
        retention-days: 30

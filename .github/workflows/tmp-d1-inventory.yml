# Temporary, read-only: lists platform D1 database names and ids. Delete with this branch.
name: d1-inventory
on:
  push:
    branches:
    - tmp/d1-inventory
permissions:
  contents: read
jobs:
  d1-inventory:
    name: d1-inventory
    runs-on: namespace-profile-linux-x86
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Determinate receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Prune Determinate Nix receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.55.1"
        if [ -z "$cuenv_version" ]; then
          cuenv_version="latest"
        fi
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -fsSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: Setup 1Password
      run: cuenv exec -- cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: List platform D1 databases (names and ids only)
      working-directory: projects/rawkode.academy/platform/brackets
      run: |-
        cuenv -e production exec -- sh -c 'bunx wrangler d1 list --json' > "$RUNNER_TEMP/d1.json"
        jq -r '.[] | select(.name | startswith("platform-")) | "::notice title=d1::\(.name) \(.uuid)"' "$RUNNER_TEMP/d1.json"
        echo "::notice title=d1-count::$(jq '[.[] | select(.name | startswith("platform-"))] | length' "$RUNNER_TEMP/d1.json") platform databases"
        rm "$RUNNER_TEMP/d1.json"
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
